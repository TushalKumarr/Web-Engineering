<!DOCTYPE html>
<html>
<head>
    <title>Nested Divs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <!-- Green Div -->
        <div class="green">
            Green
        </div>

        <!-- Middle Div -->
        <div class="middle">

            <div class="blue">
                Blue
            </div>

            <div class="red">
                Red
            </div>

            <div class="purple">
                Purple
            </div>

        </div>

        <!-- Yellow Div -->
        <div class="yellow">
            Yellow
        </div>

    </div>

</body>
</html>
