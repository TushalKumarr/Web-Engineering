<!DOCTYPE html>

<html>
    <head>

        <title>Lesson-6</title>

        <style>
            h3{
                color: cadetblue;
            }

            p{
                size: 20px;
            }
        </style>

    </head>

    <body>

        <!-- 1. Inline CSS (inside the html element using style attribute)-->
        <h1 style="color: blue;">Hello World</h1>

        <!-- Inline CSS - Adding multiple properties: -->
        <h2 style="color: green; font-size: 40px;">Hey, Today is Friday.</h2>



        <!-- 2. Internal CSS (inside the style tag usually in <head> -->
        <h3>This is heading 3.</h3>
        <p>I am a pargraph for heading 3.</p>



    </body>
</html>
